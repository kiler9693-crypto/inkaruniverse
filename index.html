
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя вселенная ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="space"></div>

    <!-- Первая страница -->
    <div class="content" id="welcome">
        <h1>Добро пожаловать в мою вселенную ИНКАР ❤️</h1>
        <p>Для тебя я приготовил кое-что особенное...</p>
        <button id="openUniverse">Открыть Вселенную ✨</button>
    </div>

    <!-- Вторая страница: галактика -->
    <div id="universe" style="display: none;">

    <button id="backButton" class="back-button">
        ← Назад
    </button>

    <h2>Найди своё послание, Инкарчик ❤️</h2>
        <p>Вращай планету и ищи светящиеся точки ✨</p>
        <div id="planet"></div>
    </div>
    <div class="universe-credit">
    © 2026 · created by roman for inkar ❤️
</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="script.js"></script>

    <script>
        const openButton = document.getElementById("openUniverse");
        const welcome = document.getElementById("welcome");
        const universe = document.getElementById("universe");

        
openButton.addEventListener("click", () => {
    welcome.style.display = "none";
    universe.style.display = "block";

    requestAnimationFrame(() => {
        if (typeof startPlanet === "function") {
            startPlanet();
            window.dispatchEvent(new Event("resize"));
        }
    });
});


const backButton = document.getElementById("backButton");

backButton.addEventListener("click", () => {
    universe.style.display = "none";
    welcome.style.display = "block";
});
    </script>

</body>  

</html>
